services:
  db:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: rootpass
      MYSQL_DATABASE: wordpress
      MYSQL_USER: wordpress
      MYSQL_PASSWORD: wordpress
    volumes:
      - db_data:/var/lib/mysql

  wordpress:
    image: wordpress:php8.2-apache
    restart: unless-stopped
    depends_on:
      - db
    ports:
      - "8080:80"
    environment:
      WORDPRESS_DB_HOST: db
      WORDPRESS_DB_NAME: wordpress
      WORDPRESS_DB_USER: wordpress
      WORDPRESS_DB_PASSWORD: wordpress
      WORDPRESS_DEBUG: 1
      # Keep logging errors/notices (WP_DEBUG_LOG) without printing them
      # on top of the page (WP_DEBUG_DISPLAY) — some plugins (e.g. onvo-pay)
      # trigger benign "doing it wrong" notices during normal operation.
      WORDPRESS_CONFIG_EXTRA: |
        define('WP_DEBUG_DISPLAY', false);
        define('WP_DEBUG_LOG', true);
        // Cuando se accede via ngrok (u otro proxy), WordPress debe usar el
        // host publico que llega en X-Forwarded-Host, no localhost:8080,
        // o generara URLs/redirects rotos hacia afuera.
        if (!empty($$_SERVER['HTTP_X_FORWARDED_HOST'])) {
            $$forwarded_proto = $$_SERVER['HTTP_X_FORWARDED_PROTO'] ?? 'https';
            $$forwarded_host = $$_SERVER['HTTP_X_FORWARDED_HOST'];
            define('WP_HOME', $$forwarded_proto . '://' . $$forwarded_host);
            define('WP_SITEURL', $$forwarded_proto . '://' . $$forwarded_host);
        }
    volumes:
      - wp_data:/var/www/html
      - ./wp-content/themes/rafiki:/var/www/html/wp-content/themes/rafiki
      - ./wp-content/plugins/woocommerce:/var/www/html/wp-content/plugins/woocommerce
      - ./wp-content/plugins/onvo-pay:/var/www/html/wp-content/plugins/onvo-pay
      - ./php-uploads.ini:/usr/local/etc/php/conf.d/uploads.ini

  wpcli:
    image: wordpress:cli
    depends_on:
      - db
      - wordpress
    user: "33:33"
    environment:
      WORDPRESS_DB_HOST: db
      WORDPRESS_DB_NAME: wordpress
      WORDPRESS_DB_USER: wordpress
      WORDPRESS_DB_PASSWORD: wordpress
    volumes:
      - wp_data:/var/www/html
      - ./wp-content/themes/rafiki:/var/www/html/wp-content/themes/rafiki
      - ./wp-content/plugins/woocommerce:/var/www/html/wp-content/plugins/woocommerce
      - ./wp-content/plugins/onvo-pay:/var/www/html/wp-content/plugins/onvo-pay
      - ./seed:/seed
    entrypoint: ["wp"]

volumes:
  db_data:
  wp_data:
